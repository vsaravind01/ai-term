[project]
name = "ai-term"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
ai-term = "ai_term.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
dependencies = [
    "openai-whisper>=20250625",
    "sounddevice>=0.5.3",
    "tts>=0.22.0",
    "fastapi>=0.112.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "textual>=0.80.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "langchain>=0.3.0",
    "langchain-ollama>=0.2.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.1",
]


[project.optional-dependencies]
dev = [
    "textual-dev>=0.80.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.1.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-mermaid2-plugin>=1.1.0",
    "mkdocstrings[python]>=0.25.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
extraPaths = [
    "src",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
