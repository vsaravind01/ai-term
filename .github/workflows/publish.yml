name: Publish to PyPI

on:
    release:
        types: [published]
    workflow_dispatch:

jobs:
    pypi-publish:
        name: Build and publish to PyPI
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install uv
              uses: astral-sh/setup-uv@v5

            - name: Build package
              run: uv build

            - name: Publish to PyPI
              run: uv publish --token ${{ secrets.PYPI_TOKEN }}
